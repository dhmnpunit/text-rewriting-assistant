# ClearDraft look: soft off-white page, white editor, dark text, one deep-green accent, Inter font.
[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "full"
primaryColor = "#166A48"
backgroundColor = "#F7F8F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202522"
borderColor = "#DDE4DF"
linkColor = "#166A48"
showWidgetBorder = true
metricValueFontSize = "1.6rem"

[client]
toolbarMode = "minimal"
